<div class="flex items-center justify-between gap-3 select-none">
  @if (label() || description()) {
    <div class="flex flex-col cursor-pointer" (click)="onToggle()">
      @if (label()) {
        <span class="text-xs font-semibold text-slate-700 uppercase tracking-wider">
          {{ label() }}
        </span>
      }
      @if (description()) {
        <span class="text-[11px] text-slate-400 mt-0.5">
          {{ description() }}
        </span>
      }
    </div>
  }

  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked()"
    [disabled]="disabled()"
    (click)="onToggle()"
    class="relative inline-flex flex-shrink-0 cursor-pointer rounded-full transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed"
    [ngClass]="[
      checked() ? 'bg-blue-600' : 'bg-slate-200',
      size() === 'sm' ? 'h-4 w-7' : (size() === 'lg' ? 'h-7 w-12' : 'h-5 w-9')
    ]">
    
    <span
      class="pointer-events-none inline-block transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"
      [ngClass]="[
        checked()
          ? (size() === 'sm' ? 'translate-x-3.5' : (size() === 'lg' ? 'translate-x-5' : 'translate-x-4'))
          : 'translate-x-0.5',
        size() === 'sm' ? 'h-3 w-3 mt-0.5' : (size() === 'lg' ? 'h-6 w-6 mt-0.5' : 'h-4 w-4 mt-0.5')
      ]">
    </span>
  </button>
</div>

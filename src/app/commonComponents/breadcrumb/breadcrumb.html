<div class="mb-6">
  <!-- Breadcrumbs Path -->
  <div class="flex items-center text-sm mb-2 select-none">
    @if (loading()) {
      <div class="flex items-center gap-2 animate-pulse">
        <div class="h-4 w-20 bg-slate-200 rounded"></div>
        <div class="h-4 w-4 bg-slate-200 rounded"></div>
        <div class="h-4 w-24 bg-slate-200 rounded"></div>
      </div>
    } @else {
      <!-- Dashboard Root Link -->
      <a
        [routerLink]="dashboardRoute()"
        class="inline-flex items-center text-blue-600 hover:text-blue-800 hover:underline font-medium transition cursor-pointer">
        <svg lucideLayoutDashboard class="w-4 h-4 mr-1 text-blue-600" />
        Dashboard
      </a>

      <!-- Item Separators & Links -->
      @for (item of items(); track $index) {
        <svg lucideChevronRight class="w-4 h-4 mx-2 text-slate-400 flex-shrink-0" />

        @if (item.to) {
          <a
            [routerLink]="item.to"
            class="text-slate-600 hover:text-blue-600 hover:underline transition truncate max-w-xs cursor-pointer">
            {{ item.label }}
          </a>
        } @else {
          <span class="font-medium text-slate-800 truncate max-w-xs">
            {{ item.label }}
          </span>
        }
      }
    }
  </div>

  <!-- Header Title & Action Controls -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      @if (loading()) {
        <div class="animate-pulse space-y-2">
          <div class="h-7 w-48 bg-slate-200 rounded"></div>
          <div class="h-4 w-64 bg-slate-200 rounded"></div>
        </div>
      } @else {
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
          {{ title() }}
        </h1>
        @if (description()) {
          <p class="text-slate-500 text-sm mt-0.5">
            {{ description() }}
          </p>
        }
      }
    </div>

    @if (!loading()) {
      <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
        <ng-content select="[actions]"></ng-content>
      </div>
    }
  </div>
</div>

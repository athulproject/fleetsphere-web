@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-all duration-200"
    (click)="handleBackdropClick()">
    
    <div
      class="bg-white rounded-2xl shadow-2xl w-full border border-slate-100 flex flex-col max-h-[90vh] overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200"
      [class]="sizeClass()"
      (click)="$event.stopPropagation()">
      
      <!-- Header -->
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white">
          <div>
            @if (title()) {
              <h3 class="text-lg font-bold text-slate-900 tracking-tight">{{ title() }}</h3>
            }
            @if (subtitle()) {
              <p class="text-xs text-slate-500 mt-0.5">{{ subtitle() }}</p>
            }
          </div>
          
          <div class="flex items-center gap-2">
            <ng-content select="[modal-header-actions]"></ng-content>

            @if (showCloseButton()) {
              <button
                type="button"
                (click)="close()"
                class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"
                title="Close modal">
                <svg lucideX class="w-5 h-5" />
              </button>
            }
          </div>
        </div>
      }

      <!-- Body -->
      <div class="p-6 overflow-y-auto scrollbar flex-1 text-slate-700 text-sm">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex items-center justify-end gap-3 empty:hidden">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}

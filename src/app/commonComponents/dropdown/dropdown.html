<div class="relative w-full">
  @if (label()) {
    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
      {{ label() }}
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    [disabled]="disabled()"
    (click)="toggle()"
    class="w-full flex items-center justify-between px-3.5 py-2.5 bg-white text-left text-sm rounded-xl border transition-all duration-150 cursor-pointer disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-400 select-none"
    [ngClass]="[
      errorText() ? 'border-red-300 focus:border-red-500 focus:ring-red-500/10' : 'border-slate-200 hover:border-slate-300 focus:border-blue-500 focus:ring-blue-500/10',
      isOpen() ? 'ring-4 ring-blue-500/10 border-blue-500' : ''
    ]">
    
    <div class="flex items-center gap-2 truncate">
      @if (selectedOption()) {
        <span class="text-slate-900 font-medium truncate">{{ selectedOption()?.label }}</span>
      } @else {
        <span class="text-slate-400 truncate">{{ placeholder() }}</span>
      }
    </div>

    <div class="flex items-center gap-1.5 ml-2 text-slate-400">
      @if (clearable() && selectedOption() && !disabled()) {
        <span
          role="button"
          tabindex="0"
          (click)="clear($event)"
          (keydown.enter)="clear($event)"
          class="p-0.5 rounded hover:bg-slate-100 hover:text-slate-600 transition"
          title="Clear selection">
          <svg lucideX class="w-3.5 h-3.5" />
        </span>
      }
      <svg
        lucideChevronDown
        class="w-4 h-4 transition-transform duration-200"
        [class.rotate-180]="isOpen()" />
    </div>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div
      class="absolute z-50 left-0 right-0 mt-1.5 bg-white rounded-xl shadow-xl border border-slate-100 p-1.5 max-h-64 overflow-y-auto scrollbar animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Search Input -->
      @if (searchable()) {
        <div class="p-1 pb-1.5 border-b border-slate-100 mb-1 sticky top-0 bg-white z-10">
          <div class="relative flex items-center">
            <svg lucideSearch class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none" />
            <input
              type="text"
              [placeholder]="searchPlaceholder()"
              [ngModel]="searchQuery()"
              (ngModelChange)="searchQuery.set($event)"
              (click)="$event.stopPropagation()"
              autofocus
              class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white text-slate-800"
            />
          </div>
        </div>
      }

      <!-- Options List -->
      <div class="space-y-0.5">
        @for (opt of filteredOptions(); track opt.value) {
          <button
            type="button"
            [disabled]="opt.disabled"
            (click)="select(opt)"
            class="w-full flex items-center justify-between px-3 py-2 text-left text-xs rounded-lg transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-40"
            [ngClass]="opt.value === value() ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-50 hover:text-slate-900'">
            
            <div class="truncate">
              <span class="block truncate">{{ opt.label }}</span>
              @if (opt.description) {
                <span class="block text-[11px] text-slate-400 font-normal truncate mt-0.5">{{ opt.description }}</span>
              }
            </div>

            @if (opt.value === value()) {
              <svg lucideCheck class="w-4 h-4 text-blue-600 flex-shrink-0 ml-2" />
            }
          </button>
        } @empty {
          <div class="py-4 text-center text-xs text-slate-400">
            No matching options
          </div>
        }
      </div>
    </div>
  }

  <!-- Error or Helper message -->
  @if (errorText()) {
    <p class="text-xs text-red-600 mt-1 font-medium">{{ errorText() }}</p>
  } @else if (helperText()) {
    <p class="text-xs text-slate-400 mt-1">{{ helperText() }}</p>
  }
</div>

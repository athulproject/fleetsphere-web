<div class="flex items-start gap-2.5 select-none cursor-pointer" (click)="onToggle()">
  <div
    class="relative flex items-center justify-center w-4 h-4 mt-0.5 rounded border transition-colors"
    [ngClass]="[
      checked() ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300 hover:border-slate-400',
      disabled() ? 'opacity-50 cursor-not-allowed bg-slate-100' : 'cursor-pointer',
      errorText() ? 'border-red-400' : ''
    ]">
    @if (checked()) {
      <svg lucideCheck class="w-3 h-3 stroke-[3]" />
    }
  </div>

  @if (label() || description()) {
    <div class="flex flex-col">
      @if (label()) {
        <span class="text-xs font-semibold text-slate-700 leading-tight">
          {{ label() }}
        </span>
      }
      @if (description()) {
        <span class="text-[11px] text-slate-400 mt-0.5">
          {{ description() }}
        </span>
      }
      @if (errorText()) {
        <span class="text-[11px] text-red-500 font-medium mt-0.5">
          {{ errorText() }}
        </span>
      }
    </div>
  }
</div>

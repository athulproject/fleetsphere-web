@if (mode() === 'overlay') {
  <div
    class="z-50 flex flex-col items-center justify-center bg-white/70 backdrop-blur-xs transition-opacity duration-200"
    [ngClass]="fullscreen() ? 'fixed inset-0' : 'absolute inset-0 rounded-xl'">
    <div class="flex flex-col items-center p-6 bg-white rounded-2xl shadow-xl border border-slate-100">
      <svg
        class="animate-spin text-blue-600 mb-3"
        [ngClass]="{
          'w-6 h-6': size() === 'sm',
          'w-9 h-9': size() === 'md',
          'w-12 h-12': size() === 'lg'
        }"
        viewBox="0 0 24 24"
        fill="none">
        <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
        <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z" />
      </svg>
      @if (message()) {
        <span class="text-xs font-semibold text-slate-700 tracking-wide">{{ message() }}</span>
      }
    </div>
  </div>
} @else if (mode() === 'skeleton') {
  <div class="space-y-3 w-full animate-pulse p-4">
    <div class="h-4 bg-slate-200 rounded-lg w-1/3"></div>
    <div class="h-10 bg-slate-200 rounded-xl w-full"></div>
    <div class="h-4 bg-slate-200 rounded-lg w-2/3"></div>
  </div>
} @else {
  <!-- Spinner Mode -->
  <div class="flex items-center justify-center gap-2 py-4 text-slate-500">
    <svg
      class="animate-spin text-blue-600"
      [ngClass]="{
        'w-4 h-4': size() === 'sm',
        'w-6 h-6': size() === 'md',
        'w-8 h-8': size() === 'lg'
      }"
      viewBox="0 0 24 24"
      fill="none">
      <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
      <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z" />
    </svg>
    @if (message()) {
      <span class="text-xs font-medium text-slate-600">{{ message() }}</span>
    }
  </div>
}
